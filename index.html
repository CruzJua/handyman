<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Under Maintenance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:   #0f1624;
      --navy-2: #1a2540;
      --cream:  #f0ead8;
      --amber:  #e8a838;
      --muted:  #8a95a8;
      --mono:   'JetBrains Mono', monospace;
      --sans:   'Inter', sans-serif;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: var(--navy);
      color: var(--cream);
      font-family: var(--sans);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
    }

    /* ── Progress bar at top ── */
    .progress-track {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--navy-2);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 40%;
      background: var(--amber);
      border-radius: 0 2px 2px 0;
      animation: sweep 2.8s ease-in-out infinite;
    }

    @keyframes sweep {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .progress-fill { animation: none; width: 60%; }
    }

    /* ── Main card ── */
    .card {
      max-width: 520px;
      width: 100%;
    }

    /* ── Eyebrow tag ── */
    .tag {
      display: inline-block;
      font-family: var(--mono);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--amber);
      border: 1px solid rgba(232, 168, 56, 0.35);
      border-radius: 3px;
      padding: 0.3em 0.75em;
      margin-bottom: 2rem;
    }

    /* ── Icon ── */
    .icon-wrap {
      width: 64px;
      height: 64px;
      margin: 0 auto 2rem;
      border-radius: 50%;
      background: var(--navy-2);
      border: 1px solid rgba(240, 234, 216, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-wrap svg {
      width: 30px;
      height: 30px;
      stroke: var(--amber);
    }

    /* ── Heading ── */
    h1 {
      font-family: var(--sans);
      font-size: clamp(2rem, 5vw, 2.8rem);
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: var(--cream);
      margin-bottom: 1rem;
    }

    h1 span {
      color: var(--amber);
    }

    /* ── Body copy ── */
    p {
      font-size: 1rem;
      line-height: 1.7;
      color: var(--muted);
      max-width: 400px;
      margin: 0 auto 2.5rem;
    }

    /* ── Divider ── */
    .divider {
      width: 40px;
      height: 1px;
      background: rgba(240, 234, 216, 0.12);
      margin: 2.5rem auto;
    }

    /* ── Clock ── */
    .clock-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--muted);
    }

    .clock-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--amber);
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.25; }
    }

    @media (prefers-reduced-motion: reduce) {
      .clock-dot { animation: none; }
    }

    #clock { color: var(--cream); }

    /* ── Footer ── */
    footer {
      position: fixed;
      bottom: 1.5rem;
      font-family: var(--mono);
      font-size: 0.7rem;
      color: rgba(138, 149, 168, 0.5);
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <div class="progress-track">
    <div class="progress-fill"></div>
  </div>

  <div class="card">
    <div class="tag">Scheduled maintenance</div>

    <div class="icon-wrap">
      <!-- wrench icon -->
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
      </svg>
    </div>

    <h1>Back <span>soon.</span></h1>

    <p>
      We're making some improvements. Things should be back up shortly — thanks for your patience.
    </p>

    <div class="divider"></div>

    <div class="clock-row">
      <div class="clock-dot"></div>
      <span>Work in progress &nbsp;·&nbsp;</span>
      <span id="clock"></span>
    </div>
  </div>

  <footer>yourdomain.com</footer>

  <script>
    function tick() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').textContent = `${h}:${m}:${s}`;
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
